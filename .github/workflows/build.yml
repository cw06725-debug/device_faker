name: Build Samsung DEFEX Device Faker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v5
        with:
          ref: main
          submodules: recursive

      - name: Show source revision
        run: |
          echo "===== Git revision ====="
          git rev-parse HEAD
          git status --short
          echo
          echo "===== samsung-defex directory ====="
          ls -la samsung-defex || true

      - name: Show Samsung DEFEX source context
        run: |
          echo "========================================"
          echo "===== companion request handler ====="
          echo "========================================"
          grep -n -A 20 -B 20 "CompanionRequest::CpuSpoofUnmount" src/companion.rs || true

          echo
          echo "========================================"
          echo "===== CompanionRequest enum ====="
          echo "========================================"
          grep -n -A 40 -B 15 "enum CompanionRequest" src/companion.rs || true

          echo
          echo "========================================"
          echo "===== CompanionResponse struct ====="
          echo "========================================"
          grep -n -A 40 -B 15 "struct CompanionResponse" src/companion.rs || true

          echo
          echo "========================================"
          echo "===== load_config call ====="
          echo "========================================"
          grep -n -A 25 -B 25 "load_config" src/lib.rs || true

          echo
          echo "========================================"
          echo "===== CONFIG_PATH ====="
          echo "========================================"
          grep -n -A 20 -B 20 "CONFIG_PATH" src/lib.rs || true

          echo
          echo "========================================"
          echo "===== send_companion_command ====="
          echo "========================================"
          grep -n -A 25 -B 25 "send_companion_command" src/companion.rs || true

      - name: Stop after source dump
        run: |
          echo "Source context collected successfully."
          echo "Please inspect the output of:"
          echo "Show Samsung DEFEX source context"
          echo
          echo "Do not continue to build yet."
