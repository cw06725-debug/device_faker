name: Build Samsung DEFEX Device Faker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v5
        with:
          ref: main
          submodules: recursive

      - name: Show source revision
        run: |
          git rev-parse HEAD
          git status --short
          ls -l samsung-defex/

      - name: Check Samsung DEFEX patch
        run: |
          git apply --check samsung-defex/device_faker_v1.5.0_samsung_defex.patch

      - name: Apply Samsung DEFEX patch
        run: |
          git apply samsung-defex/device_faker_v1.5.0_samsung_defex.patch
          git diff --check
          git diff --stat

      - name: Mark Samsung test build
        run: |
          if [ -f module/module.prop ]; then
            sed -i 's/^name=.*/name=Device Faker Samsung DEFEX/' module/module.prop
            sed -i 's/^version=.*/version=v1.5.0-samsung-defex-main/' module/module.prop
            sed -i 's/^versionCode=.*/versionCode=2026082302/' module/module.prop
            sed -i '/^updateJson=/d' module/module.prop
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
          cargo install cargo-ndk --locked

      - name: Build installable release ZIP
        run: |
          cargo run --package xtask -- build -r
          echo "=== output ==="
          find output -maxdepth 2 -type f -print
          test -f 'output/device_faker-(release).zip'
          cp 'output/device_faker-(release).zip' \
             'output/Device_Faker_Samsung_DEFEX_main.zip'
          unzip -l 'output/Device_Faker_Samsung_DEFEX_main.zip' | head -80

      - name: Upload KernelSU install ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Device_Faker_Samsung_DEFEX_main
          path: output/Device_Faker_Samsung_DEFEX_main.zip
          if-no-files-found: error

