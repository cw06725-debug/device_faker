name: Build Samsung DEFEX Device Faker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v5
        with:
          ref: main
          submodules: recursive

      - name: Apply Samsung DEFEX workaround
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          companion_path = Path("src/companion.rs")
          lib_path = Path("src/lib.rs")

          c = companion_path.read_text(encoding="utf-8")
          l = lib_path.read_text(encoding="utf-8")

          marker = "        CompanionRequest::WriteLog(request) => {"
          if marker not in c:
              raise SystemExit("ERROR: WriteLog handler marker not found")

          read_handler = """        CompanionRequest::ReadConfig => {
              const CONFIG_PATH: &str = \"/data/adb/device_faker/config/config.toml\";
              let response = match fs::read_to_string(CONFIG_PATH) {
                  Ok(content) => CompanionResponse {
                      status: 0,
                      message: Some(content),
                      backups: None,
                  },
                  Err(err) if err.kind() == std::io::ErrorKind::NotFound => {
                      CompanionResponse::ok()
                  }
                  Err(err) => {
                      error!(\"Companion failed to read config at {CONFIG_PATH}: {err}\");
                      CompanionResponse::err(format!(
                          \"Failed to read config at {CONFIG_PATH}: {err}\"
                      ))
                  }
              };

              if let Err(e) = write_companion_response(stream, &response) {
                  warn!(\"Failed to write companion response: {e}\");
              }
          }
"""
          c = c.replace(marker, read_handler + marker, 1)

          enum_marker = "    WriteLog(WriteLogRequest),"
          if enum_marker not in c:
              raise SystemExit("ERROR: CompanionRequest WriteLog enum marker not found")
          c = c.replace(enum_marker, "    ReadConfig,\n" + enum_marker, 1)

          call_marker = "let config = match load_config() {"
          if call_marker not in l:
              raise SystemExit("ERROR: load_config call not found")
          l = l.replace(
              call_marker,
              "let config = match load_config_via_companion(api) {",
              1,
          )

          pattern = re.compile(
              r'fn load_config\(\) -> anyhow::Result<Option<Config>> \{\n'
              r'.*?'
              r'\n\}\n'
              r'(?=fn configure_log_level)',
              re.S,
          )

          replacement = """fn load_config_via_companion(
              api: &mut ZygiskApi<V4>,
          ) -> anyhow::Result<Option<Config>> {
              let request = companion::CompanionRequest::ReadConfig;
              let response = companion::send_companion_command(api, &request)?;

              if response.status != 0 {
                  anyhow::bail!(
                      \"{}\",
                      response
                          .message
                          .as_deref()
                          .unwrap_or(\"companion config read failed\")
                  );
              }

              let Some(config_content) = response.message else {
                  return Ok(None);
              };

              let config = Config::from_toml(&config_content)?;
              Ok(Some(config))
          }
"""

          l, count = pattern.subn(replacement, l, count=1)
          if count != 1:
              raise SystemExit(f"ERROR: load_config function replacement count={count}")

          l = l.replace(
              "use std::{collections::HashMap, fs, path::Path};",
              "use std::collections::HashMap;",
              1,
          )
          l = l.replace("use anyhow::Context;\n", "", 1)
          l = l.replace(
              'const CONFIG_PATH: &str = "/data/adb/device_faker/config/config.toml";\n',
              "",
              1,
          )

          companion_path.write_text(c, encoding="utf-8")
          lib_path.write_text(l, encoding="utf-8")

          print("Samsung DEFEX workaround applied.")
          PY

          echo "===== diff check ====="
          git diff --check
          git diff -- src/companion.rs src/lib.rs

      - name: Mark Samsung test build
        run: |
          sed -i 's/^name=.*/name=Device Faker Samsung DEFEX/' module/module.prop
          sed -i 's/^version=.*/version=v1.5.0-samsung-defex/' module/module.prop
          sed -i 's/^versionCode=.*/versionCode=2026082304/' module/module.prop
          sed -i '/^updateJson=/d' module/module.prop
          cat module/module.prop

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
          cargo install cargo-ndk --locked

      - name: Build installable release ZIP
        run: |
          cargo run --package xtask -- build -r
          echo "===== output files ====="
          find output -maxdepth 2 -type f -print || true

          test -f 'output/device_faker-(release).zip'
          cp 'output/device_faker-(release).zip' \
             'output/Device_Faker_Samsung_DEFEX.zip'

          echo "===== ZIP contents ====="
          unzip -l 'output/Device_Faker_Samsung_DEFEX.zip' | head -100

      - name: Upload KernelSU install ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Device_Faker_Samsung_DEFEX
          path: output/Device_Faker_Samsung_DEFEX.zip
          if-no-files-found: error

