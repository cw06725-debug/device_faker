name: Build Samsung DEFEX Device Faker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5

      - name: Checkout v1.5.0 baseline
        run: |
          git fetch --tags --force
          git checkout v1.5.0

      - name: Apply Samsung DEFEX patch
        run: |
          patch -p1 < samsung-defex/device_faker_v1.5.0_samsung_defex.patch

      - name: Mark Samsung test build
        run: |
          sed -i 's/^name=.*/name=Device Faker Samsung DEFEX/' module/module.prop
          sed -i 's/^version=.*/version=v1.5.0-samsung-defex1/' module/module.prop
          sed -i 's/^versionCode=.*/versionCode=2026082301/' module/module.prop
          sed -i '/^updateJson=/d' module/module.prop

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib
          cargo install cargo-ndk --locked

      - name: Build installable release ZIP
        run: |
          cargo run --package xtask -- build -r
          test -f 'output/device_faker-(release).zip'
          cp 'output/device_faker-(release).zip' \
             'output/Device_Faker_v1.5.0_Samsung_DEFEX.zip'
          unzip -l 'output/Device_Faker_v1.5.0_Samsung_DEFEX.zip' | head -80

      - name: Upload KernelSU install ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Device_Faker_v1.5.0_Samsung_DEFEX
          path: output/Device_Faker_v1.5.0_Samsung_DEFEX.zip
          if-no-files-found: error

